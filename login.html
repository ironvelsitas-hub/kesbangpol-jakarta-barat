<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Kesbangpol Jakarta Barat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/admin.css">
    <script>
        tailwind.config = {
            theme: { extend: {
                colors: {
                    primary: { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a' },
                    gold: { 400:'#fbbf24',500:'#f59e0b',600:'#d97706' }
                },
                fontFamily: { sans: ['Inter','sans-serif'] }
            }}
        }
    </script>
</head>
<body class="font-sans min-h-screen flex items-center justify-center p-4" style="background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 50%, #3b82f6 100%);">

    <!-- Background Pattern -->
    <div class="absolute inset-0 opacity-10 pattern-bg"></div>

    <!-- Login Card -->
    <div class="relative z-10 w-full max-w-md">
        <div class="bg-white rounded-3xl shadow-2xl overflow-hidden">
            <!-- Header -->
            <div class="hero-gradient p-8 text-center">
                        <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg overflow-hidden">
                <img 
                    src="assets/images/logo1.png" 
                    alt="Logo Kesbangpol Jakarta Barat"
                    class="w-16 h-16 object-contain"
                >
            </div>
                <h1 class="text-2xl font-bold text-white mb-1">Administrator</h1>
                <p class="text-blue-100 text-sm">Kesbangpol Jakarta Barat</p>
            </div>

            <!-- Form -->
            <div class="p-8">
                <form id="loginForm">
                    <div class="mb-5">
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            <i class="fas fa-envelope mr-1 text-primary-500"></i> Email
                        </label>
                        <input type="email" id="email" 
                               value="admin@kesbangpol.jakbar.go.id"
                               class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-primary-500 focus:ring-2 focus:ring-primary-100 outline-none transition"
                               placeholder="admin@kesbangpol.jakbar.go.id" required>
                    </div>

                    <div class="mb-5">
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            <i class="fas fa-lock mr-1 text-primary-500"></i> Password
                        </label>
                        <div class="relative">
                            <input type="password" id="password" 
                                   value="admin123"
                                   class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-primary-500 focus:ring-2 focus:ring-primary-100 outline-none transition pr-12"
                                   placeholder="••••••••" required>
                            <button type="button" id="togglePass" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center mb-6">
                        <input type="checkbox" id="remember" class="w-4 h-4 text-primary-600 rounded focus:ring-primary-500" checked>
                        <label for="remember" class="ml-2 text-sm text-gray-600">Ingat saya</label>
                    </div>

                    <button type="submit" 
                            class="w-full hero-gradient text-white py-3 rounded-xl font-semibold hover:shadow-xl transition-all hover:scale-[1.02] active:scale-[0.98]">
                        <i class="fas fa-sign-in-alt mr-2"></i> Masuk
                    </button>
                </form>

                <div id="errorMsg" class="hidden mt-4 p-3 bg-red-50 border border-red-200 rounded-xl text-red-700 text-sm">
                    <i class="fas fa-exclamation-circle mr-2"></i>
                    <span id="errorText">Email atau password salah!</span>
                </div>

                <div class="mt-6 pt-6 border-t border-gray-100 text-center">
                    <a href="../index.html" class="text-sm text-gray-500 hover:text-primary-600 transition">
                        <i class="fas fa-arrow-left mr-1"></i> Kembali ke Website
                    </a>
                </div>
            </div>
        </div>

        <!-- Demo Info -->
        <div class="mt-6 bg-white/10 backdrop-blur-sm border border-white/20 rounded-xl p-4 text-white text-sm">
            <div class="flex items-center gap-2 mb-2">
                <i class="fas fa-info-circle text-gold-400"></i>
                <span class="font-semibold">Demo Login:</span>
            </div>
            <p class="text-blue-100 text-xs">Email: <code class="bg-white/20 px-2 py-0.5 rounded">admin@kesbangpol.jakbar.go.id</code></p>
            <p class="text-blue-100 text-xs mt-1">Password: <code class="bg-white/20 px-2 py-0.5 rounded">admin123</code></p>
        </div>
    </div>

    <script src="../assets/auth.js"></script>
    <script>
        // Toggle Password
        document.getElementById('togglePass').addEventListener('click', function() {
            const input = document.getElementById('password');
            const icon = this.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        });

        // Handle Login
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;

            const result = Auth.login(email, password, remember);

            if (result.success) {
                window.location.href = 'dashboard.html';
            } else {
                const errorMsg = document.getElementById('errorMsg');
                const errorText = document.getElementById('errorText');
                errorText.textContent = result.message;
                errorMsg.classList.remove('hidden');
                
                // Shake animation
                document.querySelector('.bg-white.rounded-3xl').classList.add('shake');
                setTimeout(() => {
                    document.querySelector('.bg-white.rounded-3xl').classList.remove('shake');
                }, 500);
            }
        });
    </script>
</body>
</html>
