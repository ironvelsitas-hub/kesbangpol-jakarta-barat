<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data FKUB - Kesbangpol Jakarta Barat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-gray-50">
    <main class="data-page"><div class="data-page-inner">
        <a href="index.html" class="data-page-back"><i class="fas fa-arrow-left"></i> Forum & Organisasi</a>
        <header class="data-page-header"><h1>Forum Kerukunan Umat Beragama (FKUB)</h1><p>Data terbaru yang dikelola melalui halaman admin.</p></header>
        <section class="data-panel"><div class="data-panel-header"><h2>Daftar Anggota FKUB</h2><p>Informasi anggota dan wilayah kerja.</p></div><div class="overflow-x-auto"><table class="data-table"><thead><tr><th>No</th><th>Nama</th><th>Agama</th><th>Jabatan</th><th>Kecamatan</th><th>Kontak</th></tr></thead><tbody id="tableBody"></tbody></table></div></section>
    </div>
    </main>
    <script src="../assets/js/data.js"></script><script>
        const stored = JSON.parse(localStorage.getItem('kesbangpol_fkub') || 'null');
        const rows = Array.isArray(stored) ? stored : DATA.fkub;
        document.getElementById('tableBody').innerHTML = rows.map((item, i) => `<tr><td>${i + 1}</td><td>${item.nama}</td><td>${item.agama}</td><td>${item.jabatan}</td><td>${item.kecamatan}</td><td>${item.no_hp}</td></tr>`).join('');
    </script>
</body>
</html>
