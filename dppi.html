<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen DPPI - Admin Kesbangpol</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
    <div id="adminApp"></div>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/auth.js"></script>
    <script src="../assets/js/admin.js"></script>
    <script>
        if (!Auth.requireAuth()) throw new Error('Not authenticated');
        let data = Admin.getData('dppi');
        if (!data.length) { data = DATA.dppi; Admin.setData('dppi', data); }
        function renderTable(filter = '') { const value = filter.toLowerCase(); const filtered = data.filter(item => [item.nama_organisasi, item.ketua, item.sekretaris, item.bidang, item.kecamatan].some(field => String(field || '').toLowerCase().includes(value))); return filtered.length ? filtered.map((item, index) => `<tr><td>${index + 1}</td><td>${item.nama_organisasi}</td><td>${item.ketua}</td><td>${item.sekretaris}</td><td>${item.bidang}</td><td>${item.kecamatan}</td><td>${item.no_hp}</td><td><button class="btn btn-sm btn-danger btn-icon" onclick="deleteItem(${item.id})"><i class="fas fa-trash"></i></button></td></tr>`).join('') : '<tr><td colspan="8"><div class="empty-state"><i class="fas fa-inbox"></i><p>Tidak ada data</p></div></td></tr>'; }
        const content = `<div class="data-card"><div class="data-card-header"><div><h2>Daftar Organisasi DPPI</h2><p style="font-size:13px;color:#64748b;margin-top:4px">Total: <strong>${data.length}</strong> organisasi</p></div><div style="display:flex;gap:12px"><div class="search-box"><i class="fas fa-search"></i><input id="searchInput" placeholder="Cari organisasi..."></div><button class="btn btn-primary" onclick="addItem()"><i class="fas fa-plus"></i> Tambah</button></div></div><div style="overflow-x:auto"><table class="data-table"><thead><tr><th>No</th><th>Organisasi</th><th>Ketua</th><th>Sekretaris</th><th>Bidang</th><th>Kecamatan</th><th>Kontak</th><th>Aksi</th></tr></thead><tbody id="tableBody">${renderTable()}</tbody></table></div></div>`;
        Admin.renderPage('Manajemen DPPI', 'Data Forum & Organisasi', content);
        document.getElementById('searchInput')?.addEventListener('input', event => document.getElementById('tableBody').innerHTML = renderTable(event.target.value));
        function addItem() { Admin.openModal('Tambah Organisasi DPPI', '<div class="form-group"><label class="form-label">Nama Organisasi *</label><input class="form-input" name="nama_organisasi" required></div><div class="form-group"><label class="form-label">Ketua *</label><input class="form-input" name="ketua" required></div><div class="form-group"><label class="form-label">Sekretaris *</label><input class="form-input" name="sekretaris" required></div><div class="form-group"><label class="form-label">Bidang *</label><input class="form-input" name="bidang" required></div><div class="form-group"><label class="form-label">Kecamatan *</label><input class="form-input" name="kecamatan" required></div><div class="form-group"><label class="form-label">No. HP *</label><input class="form-input" name="no_hp" required></div>', item => { item.id = data.length ? Math.max(...data.map(row => row.id)) + 1 : 1; data.push(item); Admin.setData('dppi', data); document.getElementById('tableBody').innerHTML = renderTable(); Admin.toast('Data DPPI berhasil ditambahkan!'); }); }
        function deleteItem(id) { const item = data.find(row => row.id === id); Admin.confirm(`Hapus organisasi "${item.nama_organisasi}"?`, () => { data = data.filter(row => row.id !== id); Admin.setData('dppi', data); document.getElementById('tableBody').innerHTML = renderTable(); Admin.toast('Data DPPI berhasil dihapus!'); }); }
        window.addItem = addItem; window.deleteItem = deleteItem;
    </script>
</body>
</html>
